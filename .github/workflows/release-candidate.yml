name: Build release candidate packages

# Packaging runners are used only for deliberate RC gates.
# Routine source changes must not trigger this workflow.
on:
  workflow_dispatch:
  push:
    branches: [build/rc]

permissions:
  contents: read

concurrency:
  group: rc-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Corresponding source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and verify corresponding-source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          bash packaging/source/build-corresponding-source.sh dist/source/Corresponding-Source-remarquee-rmapi.tar.gz
          source_check="$RUNNER_TEMP/iserv-rm-source-check"
          mkdir -p "$source_check"
          tar -C "$source_check" -xzf dist/source/Corresponding-Source-remarquee-rmapi.tar.gz
          source_root="$source_check/Corresponding-Source-remarquee-rmapi"
          (cd "$source_root/rmapi" && go test ./api -run '^TestSafeParseToken' -count=1)
          (cd "$source_root/remarquee" && go mod edit -replace=github.com/juruen/rmapi=../rmapi && go mod tidy && go build ./cmd/remarquee)
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          (cd "$source_root/rmapi" && "$(go env GOPATH)/bin/govulncheck" ./api)
          (cd "$source_root/remarquee" && "$(go env GOPATH)/bin/govulncheck" ./cmd/remarquee)
          cd dist/source
          sha256sum Corresponding-Source-remarquee-rmapi.tar.gz > Corresponding-Source-remarquee-rmapi.tar.gz.sha256
          sha256sum -c Corresponding-Source-remarquee-rmapi.tar.gz.sha256
      - name: Upload corresponding source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-source
          path: dist/source/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and verify Linux package
        shell: bash
        run: bash packaging/linux/build.sh "${{ matrix.arch }}"
      - name: Upload Linux package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 + ARM64 installers
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build installers and run x64 install/uninstall smoke test
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Require exact Windows release set
        shell: pwsh
        run: |
          $expected = @(
            'IServ-reMarkable-windows-amd64-Setup.exe',
            'IServ-reMarkable-windows-amd64-Setup.exe.sha256',
            'IServ-reMarkable-windows-arm64-Setup.exe',
            'IServ-reMarkable-windows-arm64-Setup.exe.sha256',
            'IServ-reMarkable-windows.version.txt'
          )
          $actual = @(Get-ChildItem dist\windows -File | Select-Object -ExpandProperty Name | Sort-Object)
          $wanted = @($expected | Sort-Object)
          if (Compare-Object $actual $wanted) { throw "Unexpected Windows artifact set: $($actual -join ', ')" }
      - name: Upload Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Universal macOS DMG
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build universal app, icon and DMG
        shell: bash
        run: bash packaging/macos/build.sh
      - name: Upload macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-macos
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Audit exact RC bundle
    needs: [source, linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rc-*
          path: audit
          merge-multiple: true
      - name: Verify checksums, versions and archive structures
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/audit_artifacts.py audit
          dpkg-deb --info audit/IServ-reMarkable-linux-amd64.deb >/dev/null
          dpkg-deb --info audit/IServ-reMarkable-linux-arm64.deb >/dev/null
          mkdir -p audit-deb-amd64 audit-deb-arm64
          dpkg-deb -x audit/IServ-reMarkable-linux-amd64.deb audit-deb-amd64
          dpkg-deb -x audit/IServ-reMarkable-linux-arm64.deb audit-deb-arm64
          test -x audit-deb-amd64/usr/lib/iserv-remarkable-setup/iserv-remarkable-setup
          test -x audit-deb-arm64/usr/lib/iserv-remarkable-setup/iserv-remarkable-setup
          test -s audit-deb-amd64/usr/share/icons/hicolor/scalable/apps/iserv-remarkable-setup.svg
          test -s audit-deb-arm64/usr/share/icons/hicolor/scalable/apps/iserv-remarkable-setup.svg
      - name: Produce combined manifest
        shell: bash
        run: |
          set -euo pipefail
          cp RELEASE_NOTES_RC.md audit/RELEASE_NOTES_RC.md
          cp THIRD_PARTY_NOTICES.md audit/THIRD_PARTY_NOTICES.md
          cp SECURITY.md audit/SECURITY.md
          cp PRIVACY.md audit/PRIVACY.md
          cd audit
          sha256sum \
            Corresponding-Source-remarquee-rmapi.tar.gz \
            IServ-reMarkable-linux-amd64.tar.gz \
            IServ-reMarkable-linux-amd64.deb \
            IServ-reMarkable-linux-arm64.tar.gz \
            IServ-reMarkable-linux-arm64.deb \
            IServ-reMarkable-windows-amd64-Setup.exe \
            IServ-reMarkable-windows-arm64-Setup.exe \
            IServ-reMarkable-macos.dmg > SHA256SUMS
          sha256sum -c SHA256SUMS
          printf 'source_commit=%s\n' "$GITHUB_SHA" > RC_BUILD.txt
          printf 'workflow_run=%s\n' "$GITHUB_RUN_ID" >> RC_BUILD.txt
          cd ..
          python3 packaging/audit_artifacts.py audit \
            --final-commit "$GITHUB_SHA" \
            --final-run "$GITHUB_RUN_ID"
      - name: Upload audited RC bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-audited-bundle
          path: audit/*
          if-no-files-found: error
          retention-days: 14
